# Performance-test tenant: bigger brokers, throughput-oriented broker config, Cruise Control off (less noise).
# Check worker capacity first (see README "Performance testing"): each broker asks for 4 CPU / 16Gi.
tenant: perf
domain: kafka.example.com   # CHANGE to your Route 53 zone
environment: perf
kafka:
  jvmXmx: 8g
  jvmXms: 8g
  resources:
    requests: {cpu: "4", memory: 16Gi}
    limits:   {cpu: "4", memory: 16Gi}     # ~8Gi left for page cache
  storage: {size: 200Gi}                   # class: <name> to pick a StorageClass
  antiAffinity: required
  config:
    num.network.threads: 8
    num.io.threads: 16
    num.replica.fetchers: 4
    socket.send.buffer.bytes: 1048576
    socket.receive.buffer.bytes: 1048576
    socket.request.max.bytes: 104857600
    replica.fetch.max.bytes: 10485760
    message.max.bytes: 10485760
    replica.socket.receive.buffer.bytes: 4194304
    queued.max.requests: 1000
    log.segment.bytes: 1073741824
    log.retention.minutes: 60
    log.retention.check.interval.ms: 60000
controllers:
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits:   {cpu: "1", memory: 2Gi}
cruiseControl: {enabled: false}
security: {authentication: none, authorization: none}
# Different partition counts to see how parallelism scales (all RF 3)
topics:
  - {name: perf-6,  partitions: 6,  replicas: 3, config: {retention.ms: 3600000}}
  - {name: perf-12, partitions: 12, replicas: 3, config: {retention.ms: 3600000}}
  - {name: perf-36, partitions: 36, replicas: 3, config: {retention.ms: 3600000}}
