tenant: acme-orders-dev
domain: kafka.example.com   # CHANGE to your Route 53 zone
environment: dev
kafka:
  jvmXmx: 2g
  jvmXms: 2g
  resources: {requests: {cpu: "1", memory: 4Gi}, limits: {cpu: "2", memory: 4Gi}}
  storage: {size: 100Gi}
  antiAffinity: preferred
controllers: {dedicated: false}    # combined roles: 3 pods instead of 6
